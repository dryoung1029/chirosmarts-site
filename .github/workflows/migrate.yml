name: migrate

# Apply D1 migrations to PRODUCTION from GitHub, from any device, with no
# local wrangler login. (Run it from the Actions tab → migrate → Run workflow,
# which works from a phone or iPad.)
#
# Runs automatically when a push to main changes migrations/, so the database
# catches up with the code that Pages is deploying at the same moment. Our
# migrations are additive-only (see CLAUDE.md), so either finishing first is safe.
#
# One-time setup, as repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_ACCOUNT_ID  the account that OWNS the chirosmarts D1 database
#                          (Cloudflare dashboard → Workers & Pages → right sidebar).
#                          Pinning it here also sidesteps the wrong-account 7403 error.
#   CLOUDFLARE_API_TOKEN   an API token with "Account → D1 → Edit" for that account.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only list pending migrations, don't apply
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["migrations/**"]

concurrency:
  group: d1-migrate
  cancel-in-progress: false # never interrupt a migration

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Credentials present
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets (see the comment at the top of .github/workflows/migrate.yml)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Pending migrations
        run: npx wrangler d1 migrations list chirosmarts --remote
      - name: Apply
        if: ${{ github.event_name == 'push' || !inputs.dry_run }}
        run: npx wrangler d1 migrations apply chirosmarts --remote
